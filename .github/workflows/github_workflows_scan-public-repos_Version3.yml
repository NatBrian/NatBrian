name: Weekly public repo secret scan (NatBrian)

on:
  schedule:
    - cron: "0 3 * * 0" # weekly Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "GitHub username or org whose PUBLIC repos will be scanned"
        required: true
        default: "NatBrian"
      per_page:
        description: "Number of repos per page for listing (max 100)"
        required: false
        default: "100"

permissions:
  contents: read
  issues: write

jobs:
  scan-public-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this workflow repo
        uses: actions/checkout@v4

      - name: Install prerequisites + gitleaks
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq git curl
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: List public repos for user/org
        id: list_repos
        env:
          TARGET: ${{ inputs.target || 'NatBrian' }}
          PER_PAGE: ${{ inputs.per_page || '100' }}
        run: |
          set -euo pipefail
          page=1
          out=repos_to_scan.txt
          > "$out"

          # Try org endpoint first; fallback to user endpoint if org returns empty
          while :; do
            resp=$(curl -s "https://api.github.com/orgs/${TARGET}/repos?type=public&per_page=${PER_PAGE}&page=${page}")
            count=$(echo "$resp" | jq 'length')

            if [ "$count" -eq 0 ] && [ "$page" -eq 1 ]; then
              resp=$(curl -s "https://api.github.com/users/${TARGET}/repos?type=public&per_page=${PER_PAGE}&page=${page}")
              count=$(echo "$resp" | jq 'length')
            fi

            if [ "$count" -eq 0 ]; then break; fi
            echo "$resp" | jq -r '.[].full_name' >> "$out"
            page=$((page+1))
          done

          echo "repos_file=$out" >> "$GITHUB_OUTPUT"
          echo "Found $(wc -l < "$out") public repos to scan for ${TARGET}"

      - name: Clone each repo and run gitleaks (full history)
        id: scan
        env:
          REPOS_FILE: ${{ steps.list_repos.outputs.repos_file }}
        run: |
          set -euo pipefail
          mkdir -p reports
          total_findings=0

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            echo "=== Scanning $repo ==="

            tmpdir=$(mktemp -d)

            # Full clone (no --depth) so we can scan history
            if ! git clone "https://github.com/${repo}.git" "$tmpdir" ; then
              echo "Clone failed for $repo"
              rm -rf "$tmpdir"
              continue
            fi

            # gitleaks: scan git history
            report_path="reports/${repo//\//_}-gitleaks.json"
            # Don't fail the whole workflow per-repo; we'll summarize later
            /usr/local/bin/gitleaks detect \
              --source="$tmpdir" \
              --log-opts="--all" \
              --report-format=json \
              --report-path="$report_path" \
              --exit-code=2 || true

            # Count findings in a version-tolerant way
            if [ -s "$report_path" ]; then
              # Some gitleaks versions output an array; others output an object with "Leaks"
              c=$(jq -r 'if type=="array" then length elif .Leaks then (.Leaks|length) else 0 end' "$report_path" 2>/dev/null || echo 0)
            else
              c=0
            fi

            echo "$repo: $c"
            total_findings=$((total_findings + c))

            rm -rf "$tmpdir"
          done < "$REPOS_FILE"

          echo "total_findings=$total_findings" >> "$GITHUB_OUTPUT"
          echo "Total findings across all repos: $total_findings"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: reports

      - name: Create central issue if leaks found (GitHub notifications)
        if: steps.scan.outputs.total_findings != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const dir = 'reports';
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir).filter(f => f.endsWith('-gitleaks.json'))
              : [];

            let total = 0;
            const perRepo = [];

            for (const f of files) {
              const p = `${dir}/${f}`;
              if (!fs.statSync(p).size) continue;

              let data;
              try {
                data = JSON.parse(fs.readFileSync(p, 'utf8') || '[]');
              } catch {
                continue;
              }

              const leaks = Array.isArray(data) ? data : (Array.isArray(data?.Leaks) ? data.Leaks : []);
              const count = leaks.length;
              if (!count) continue;

              total += count;

              // Safe summary: rule + file + line only (no secret values)
              const sample = leaks.slice(0, 3).map(d => ({
                rule: d.RuleID || d.rule || 'unknown',
                file: d.File || d.file || 'unknown',
                line: d.StartLine || d.start_line || 'n/a'
              }));

              const repo = f.replace('-gitleaks.json','').replace(/_/g,'/');
              perRepo.push({ repo, count, sample });
            }

            if (total === 0) {
              core.info('No leaks detected across repos (no issue created).');
              return;
            }

            const target = '${{ inputs.target || 'NatBrian' }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const title = `🚨 Public repo secret scan: ${total} potential leak(s) for ${target}`;
            const body = [
              `gitleaks detected **${total}** potential secret(s) across public repos for **${target}**.`,
              ``,
              `Workflow run: ${runUrl}`,
              ``,
              `Per-repo summary:`,
              ...perRepo.map(r => `- **${r.repo}**: ${r.count} finding(s); samples: ${JSON.stringify(r.sample)}`),
              ``,
              `Reports are attached as workflow artifacts: **gitleaks-reports**.`,
              ``,
              `Next steps: verify (false positives happen), rotate any real credentials, and remove secrets from git history if confirmed.`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

      - name: No leaks found
        if: steps.scan.outputs.total_findings == '0'
        run: echo "No leaks found across scanned public repos."
        
